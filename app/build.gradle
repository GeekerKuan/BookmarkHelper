plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'pro.kisscat.www.bookmarkhelper'
    compileSdk = 37

    defaultConfig {
        applicationId = 'pro.kisscat.www.bookmarkhelper'
        minSdk = 31
        targetSdk = 37
        // Experimental Via -> Edge branch. The final Coolapk package identity
        // and release signing key must be chosen before publishing.
        versionCode = 10015
        versionName = '1.0.0-alpha.1'
        buildConfigField 'String', 'INTERNAL_VERSION', '"dev-20260810.1"'

        resourceConfigurations += ['zh', 'en']
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    // Compose/Miuix has a large method surface. Compress DEX entries in the APK
    // instead of trading a 4x download-size increase for slightly faster installs.
    packaging {
        dex {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
        release {
            // Release signing is intentionally supplied by the publisher, not
            // required through local Gradle properties during normal builds.
            minifyEnabled = false
            shrinkResources = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation platform('androidx.compose:compose-bom:2026.05.01')
    implementation 'androidx.compose.material3:material3:1.5.0-alpha22'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.2'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.2'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.2'
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Provided by LSPosed/compatible frameworks at runtime; never bundled into the APK.
    compileOnly 'io.github.libxposed:api:101.0.1'

    implementation 'com.alibaba:fastjson:1.2.84'

    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
